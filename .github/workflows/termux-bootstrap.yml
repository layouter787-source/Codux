name: Build embedded Termux runtime

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: 7e1a5db289ad89f97bb295a515ea3096b87eb1cd
          path: termux-packages
          persist-credentials: false
      - name: Free disk space and add swap
        run: |
          set -eux
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          mnt_free_gb="$(df -BG --output=avail /mnt | tail -n1 | tr -dc '0-9')"
          swap_gb=$(( mnt_free_gb > 14 ? 12 : mnt_free_gb - 2 ))
          if [ "$swap_gb" -ge 4 ]; then
            sudo fallocate -l "${swap_gb}G" /mnt/codux-swap
            sudo chmod 600 /mnt/codux-swap
            sudo mkswap /mnt/codux-swap
            sudo swapon /mnt/codux-swap
          fi
          free -h
          df -h / /mnt || true
      - name: Point apr-util at a mirror that still serves it
        working-directory: termux-packages
        run: |
          set -euo pipefail
          version="$(sed -n 's/^TERMUX_PKG_VERSION="\(.*\)"$/\1/p' packages/apr-util/build.sh)"
          expected="$(sed -n 's/^TERMUX_PKG_SHA256=\(.*\)$/\1/p' packages/apr-util/build.sh)"
          test -n "$version"
          test -n "$expected"
          good=""
          for base in \
            https://archive.apache.org/dist/apr \
            https://downloads.apache.org/apr \
            https://dlcdn.apache.org/apr \
            https://www.apache.org/dist/apr \
            https://ftp.tsukuba.wide.ad.jp/apache/apr \
            https://mirrors.ocf.berkeley.edu/apache/apr \
            https://apache.cs.uu.nl/apr
          do
            rm -f /tmp/apr-util.tar.gz
            echo "A tentar $base/apr-util-$version.tar.gz"
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 -o /tmp/apr-util.tar.gz "$base/apr-util-$version.tar.gz" \
              && echo "$expected  /tmp/apr-util.tar.gz" | sha256sum -c -; then
              good="$base"
              break
            fi
          done
          if [ -z "$good" ]; then
            echo "::error::apr-util-$version.tar.gz indisponível (com o SHA-256 esperado) em todos os espelhos"
            exit 1
          fi
          sed -i "s|^TERMUX_PKG_SRCURL=.*|TERMUX_PKG_SRCURL=\"$good/apr-util-\${TERMUX_PKG_VERSION}.tar.gz\"|" packages/apr-util/build.sh
          grep -n '^TERMUX_PKG_SRCURL=' packages/apr-util/build.sh
          echo "apr-util $version será descarregado de $good"
      - name: Build Termux bootstrap for Codux package paths
        working-directory: termux-packages
        run: |
          sed -i 's/^TERMUX_APP__PACKAGE_NAME="com.termux"$/TERMUX_APP__PACKAGE_NAME="dev.codux"/' scripts/properties.sh
          grep -q '^TERMUX_APP__PACKAGE_NAME="dev.codux"$' scripts/properties.sh
          sed -i 's/PACKAGES+=("bzip2")/PACKAGES+=("libbz2")/' scripts/build-bootstraps.sh
          grep -q 'PACKAGES+=("libbz2")' scripts/build-bootstraps.sh
          ! grep -q 'PACKAGES+=("bzip2")' scripts/build-bootstraps.sh
          sed -i 's|mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"|mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/output/"|' scripts/build-bootstraps.sh
          grep -q '$TERMUX_PACKAGES_DIRECTORY/output/' scripts/build-bootstraps.sh
          ! grep -q '$TERMUX_PACKAGES_DIRECTORY/"' scripts/build-bootstraps.sh
          test -s packages/codex/build.sh
          grep -q '^TERMUX_PKG_LICENSE="Apache-2.0, MIT"$' packages/codex/build.sh
          test -s packages/proot/build.sh
          test -s packages/curl/build.sh
          grep -rl 'https://downloads.apache.org/' packages | xargs -r sed -i 's|https://downloads.apache.org/|https://archive.apache.org/dist/|g'
          grep -q 'https://archive.apache.org/dist/apr/apr-util' packages/apr-util/build.sh
          curl -fsSI --retry 3 https://archive.apache.org/dist/apr/apr-util-1.6.5.tar.gz > /dev/null
          echo "apr-util disponível no arquivo do Apache"
          export TERMUX_DOCKER_EXEC_EXTRA_ARGS="--env TERMUX_PKG_MAKE_PROCESSES=2 --env CARGO_PROFILE_RELEASE_LTO=thin --env CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 --env CARGO_PROFILE_RELEASE_DEBUG=0"
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 --add codex,proot,curl
      - name: Diagnostics after failure
        if: failure()
        run: |
          df -h / /mnt || true
          free -h || true
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -n 20 || true
          docker ps -a || true
      - name: Validate bootstrap archives and create checksums
        id: manifest
        run: |
          set -euo pipefail
          zip=termux-packages/output/bootstrap-aarch64.zip
          test -s "$zip"
          unzip -t "$zip" > /dev/null
          unzip -Z1 "$zip" > bootstrap-files.txt
          for required in bin/bash bin/codex bin/codex-code-mode-host bin/proot bin/curl SYMLINKS.txt; do
            grep -qx "$required" bootstrap-files.txt || { echo "::error::bootstrap sem $required"; exit 1; }
          done
          grep -Eq '^lib/libtermux-exec(-ld-preload)?\.so$' bootstrap-files.txt || { echo "::error::bootstrap sem biblioteca termux-exec"; exit 1; }
          grep -qx 'etc/tls/cert.pem' bootstrap-files.txt || { echo "::error::bootstrap sem certificados TLS"; exit 1; }
          grep -qx 'share/doc/codex/LICENSE' bootstrap-files.txt || { echo "::error::bootstrap sem licença LICENSE do Codex"; exit 1; }
          grep -qx 'share/doc/codex/NOTICE' bootstrap-files.txt || { echo "::error::bootstrap sem licença NOTICE do Codex"; exit 1; }
          mkdir -p /tmp/bootstrap-check
          unzip -q "$zip" -d /tmp/bootstrap-check
          if grep -RIl --exclude='*.so' '/data/data/com\.termux' /tmp/bootstrap-check >/tmp/legacy-paths.txt 2>/dev/null; then
            echo '::warning::alguns ficheiros de texto trazem /data/data/com.termux; o Codux troca por /data/data/dev.codux ao instalar o runtime:'
            cat /tmp/legacy-paths.txt
          fi
          if ! grep -RIl --exclude='*.so' '/data/data/dev\.codux' /tmp/bootstrap-check >/tmp/codux-paths.txt 2>/dev/null; then
            echo '::error::bootstrap não contém referências esperadas a /data/data/dev.codux'
            exit 1
          fi
          codex_version="$(sed -n 's/^TERMUX_PKG_VERSION="\(.*\)"$/\1/p' termux-packages/packages/codex/build.sh)"
          test -n "$codex_version"
          printf 'Codux package: dev.codux\nTermux packages source: 7e1a5db289ad89f97bb295a515ea3096b87eb1cd\nTermux app source reference: 8629e632fcb95da272221be327db653fb24befe9\nEmbedded Codex CLI package version: %s\nEmbedded Codex CLI license: Apache-2.0 and MIT; upstream notices are included by the Termux package\nBootstrap compatibility patch: use upstream libbz2 package, which provides the bzip2 bootstrap subpackage\nRunner output fix: write the archive into the Termux builder output directory\nSource fix: apr-util is fetched from a mirror that still serves it, checked against the Termux SHA-256\nLegacy package-path guard: reject /data/data/com.termux and require /data/data/dev.codux\n' "$codex_version" > termux-bootstrap-manifest.txt
          (cd termux-packages/output && sha256sum bootstrap-aarch64.zip) >> termux-bootstrap-manifest.txt
      - name: Keep the built archive for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codux-termux-bootstrap-zip
          path: termux-packages/output/bootstrap-aarch64.zip
          if-no-files-found: ignore
      - name: Publish versioned bootstrap assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=codux-termux-bootstrap-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Codux embedded Termux bootstrap v1" --notes-file termux-bootstrap-manifest.txt
          fi
          gh release upload "$tag" termux-packages/output/bootstrap-aarch64.zip termux-bootstrap-manifest.txt --clobber
      - uses: actions/upload-artifact@v6
        with:
          name: codux-termux-bootstrap-source-build
          path: termux-bootstrap-manifest.txt
