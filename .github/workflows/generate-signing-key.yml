name: Generate signing key

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Create keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CODUX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f signing/codux.p12 ]; then
            echo "::error::signing/codux.p12 já existe. Não vou sobrescrever a chave."
            exit 1
          fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 24 ]; then
            echo "::error::CODUX_KEYSTORE_PASSWORD precisa ter pelo menos 24 caracteres."
            exit 1
          fi
          mkdir -p signing
          keytool -genkeypair -storetype PKCS12 -keystore signing/codux.p12 \
            -alias codux -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Codux, O=Codux, C=BR"
          keytool -list -keystore signing/codux.p12 -storepass "$KEYSTORE_PASSWORD" > /dev/null
      - name: Commit keystore
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f signing/codux.p12
          git commit -m "Add password-protected release signing keystore"
          git push origin HEAD:${{ github.ref_name }}
