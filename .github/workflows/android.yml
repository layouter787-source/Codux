name: Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'README.md'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'third_party/**'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'README.md'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'third_party/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - name: Include embedded Termux bootstrap when published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p app/src/main/assets
          if gh release view codux-termux-bootstrap-v1 --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release download codux-termux-bootstrap-v1 --repo "$GH_REPO" --pattern bootstrap-aarch64.zip --dir app/src/main/assets
          fi
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codux-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: codux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
